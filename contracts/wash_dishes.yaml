draft: false
schema_version: 2
intended_use: research
task: wash dishes
collection_purpose: First-person demonstrations for robot manipulation training
lab_instructions: Show dish washing at a sink. Dishes must be rinsed and set aside
  at completion. Brief hand exits are acceptable when handling remains understandable.
goal:
  id: dishes_rinsed_and_set_aside
  description: Dishes rinsed and set aside.
  required: true
  on_failure: reject
  on_uncertain: human_review
  allow_explicit_request_override: true
process:
- id: dish_handling_visible
  description: The sink or dish is visible and task-relevant handling can be followed.
  required: true
  brief_gap_tolerance_s: 2.0
  on_brief_gap: allow
  on_long_gap: exclude_interval
- id: one_hand_visible
  description: At least one hand is visible while handling the item.
  required: false
  on_failure: warning
  measurement: hand_present
  target: 0.60
  review_band: 0.10
- id: idle
  description: No idle stretch over 3 s
  max_idle_s: 3.0
  on_failure: exclude_interval
  measurement: active_fraction
  target: 1.0
requirements:
  landscape:
    enabled: true
    required: false
    on_failure: warning
  min_height_px:
    enabled: true
    value: 720
    required: false
    on_failure: warning
  min_fps:
    enabled: true
    value: 24
    required: false
    on_failure: warning
  faces:
    enabled: true
    on_detection: flag_for_blur
    reject_whole_clip: false
  sensors:
    required: false
    when_missing: unverified
duration:
  min_usable_seconds: null
  exclude_flagged_intervals: true
  trimming_policy: conservative
  exclude_only_when: task_relevant_content_is_clearly_unusable
  uncertain_intervals: retain_and_flag_for_review
  preserve_context_before_after_s: 1.0
decision:
  accept_when: required_goal_and_process_pass_after_allowed_exclusions
  reject_when: required_goal_fails_or_explicit_lab_limit_is_violated
  uncertain_evidence: human_review
  score_is_acceptance_probability: false
ai_review:
  provider: anthropic
  initial_evidence: task_overview_and_start_end_frames
  follow_up: uncertainty_and_long_gap_windows_only
  include_context_before_after_s: 1.0
  cite_supplied_frames: true
  do_not_infer_continuity_between_sparse_frames: true
value:
  eligible_clips: accepted_only
  compare:
  - scene
  - hand_motion_when_available
  - folding_steps
  duplicate_action: flag_group_and_keep_best_approved_example
  wanted_variations: []
min_usable_seconds: null
